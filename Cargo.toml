[workspace]
resolver = "2"
members = [
    "crates/gpudog-core",
    "crates/gpudog-client",
    "crates/gpudog-daemon",
    "crates/gpudog",
    "crates/gpudogd",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.88"
authors = ["Takuma Saito <33742727+tkm-st@users.noreply.github.com>"]
repository = "https://github.com/tkm-st/gpudog"
homepage = "https://tkm-st.github.io/gpudog/"
# Released as GitHub artifacts, never to crates.io.
publish = false

[workspace.dependencies]
gpudog-core = { path = "crates/gpudog-core" }
gpudog-client = { path = "crates/gpudog-client" }
gpudog-daemon = { path = "crates/gpudog-daemon" }
anyhow = "1"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["fs", "signal", "socket", "user"] }
nvml-wrapper = "0.13"
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-11040"] }
# Safe default-disposition re-raise for `gpudog run` (workspace denies unsafe).
# Cargo.lock holds 0.4.5: 0.4.6 was under two weeks old when this was added.
signal-hook = { version = "0.4.5", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "process"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
