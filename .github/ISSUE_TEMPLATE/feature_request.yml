name: Feature request
description: Suggest a change to how GPUDog shares GPUs.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe the situation on your machine, for example how many users and GPUs share it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like GPUDog to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
