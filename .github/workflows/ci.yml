name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-ci
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_type == 'branch' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  tests:
    name: Tests (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [debug, release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Build and test workspace
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          flags=()
          if [[ "$PROFILE" == release ]]; then flags+=(--release); fi
          cargo build --locked --workspace "${flags[@]}"
          cargo test --locked --workspace "${flags[@]}"

  dependencies:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - name: Install cargo-deny
        run: |
          mkdir -p tmp/tools
          curl --fail --silent --show-error --location \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            --output tmp/tools/cargo-deny.tar.gz
          echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  tmp/tools/cargo-deny.tar.gz' | sha256sum --check --strict
          tar -xzf tmp/tools/cargo-deny.tar.gz --strip-components=1 -C tmp/tools \
            cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
      - name: Match the license allowlists
        run: |
          python3 - <<'PY'
          import importlib.util
          import tomllib
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("licenses", "scripts/third-party-licenses.py")
          licenses = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(licenses)
          allowed = set(tomllib.loads(Path("deny.toml").read_text())["licenses"]["allow"])
          if allowed != licenses.ALLOWED:
              raise SystemExit(f"deny.toml allows {sorted(allowed)}, third-party-licenses.py {sorted(licenses.ALLOWED)}")
          PY
      # Deterministic: the locked graph against deny.toml.
      - run: tmp/tools/cargo-deny --locked check bans licenses sources
      # Changes without a commit: it fetches the RustSec database at run time.
      - run: tmp/tools/cargo-deny --locked check advisories

  documentation:
    name: Documentation and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check workflow syntax
        run: |
          mkdir -p tmp/tools
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output tmp/tools/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  tmp/tools/actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf tmp/tools/actionlint.tar.gz -C tmp/tools actionlint
          tmp/tools/actionlint
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.0 '**/*.md' '#target' '#tmp' '#externals' '#build'
      - name: Check repository text
        run: python3 scripts/check-repo-text.py
      - name: Install documentation and workflow test tools
        run: |
          python3 -m venv tmp/docs-tools
          tmp/docs-tools/bin/pip install uv==0.12.3
      - name: Test release guards without publishing
        run: tmp/docs-tools/bin/uv run scripts/test-actions.py
      - name: Build documentation
        run: tmp/docs-tools/bin/uvx --from zensical==0.0.74 zensical build --clean

  containers:
    name: Bookworm containers (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/container-check.py
      - name: Retain container diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-diagnostics
          path: tmp/containers-*/*.log
          if-no-files-found: ignore
          retention-days: 7

  release-check:
    name: glibc 2.28 artifacts (CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 scripts/test-release-elf.py
      - run: python3 scripts/release-check.py --output tmp/release
      - name: Retain verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: tmp/release/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Retain release diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-diagnostics
          path: tmp/containers-*/*.log
          if-no-files-found: ignore
          retention-days: 7
