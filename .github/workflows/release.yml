name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Match tag to workspace version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          expected = 'v' + version
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must be {expected}')
          prerelease = '-' in version.split('+', 1)[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"prerelease={str(prerelease).lower()}\n")
          PY
      - name: Write release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-notes.py "${RELEASE_TAG#v}" > release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes-${{ github.sha }}
          path: release-notes.md
          if-no-files-found: error

  verify:
    name: Release gates
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified artifacts
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # No source checkout or build runs with publication permissions.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
          path: tmp/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes-${{ github.sha }}
          path: tmp/notes
      - name: Verify downloaded bytes
        working-directory: tmp/release
        run: sha256sum --check --strict SHA256SUMS
      - name: Publish GitHub release
        working-directory: tmp/release
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          NOTES_FILE: ${{ github.workspace }}/tmp/notes/release-notes.md
        run: |
          # A failed upload may leave a draft. Never replace a published release.
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo 'Refusing to overwrite an already published release' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file "$NOTES_FILE"
          fi
          # The binaries ship only inside the tar and the deb, beside their
          # LICENSE and THIRD-PARTY-LICENSES.
          gh release upload "$RELEASE_TAG" --clobber \
            ./*.tar.gz ./*.deb SHA256SUMS dependencies.txt toolchain.txt
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest=false

  docs:
    name: Build documentation site
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install documentation tools
        run: |
          python3 -m venv tmp/docs-tools
          tmp/docs-tools/bin/pip install uv==0.12.3
      - name: Build documentation
        run: tmp/docs-tools/bin/uvx --from zensical==0.0.74 zensical build --clean
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # A failed deploy can be rerun ("Re-run failed jobs") while this lasts.
          retention-days: 7

  pages:
    name: Deploy documentation site
    needs: [version, publish, docs]
    # Prereleases never replace the site.
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    # Above deploy-pages' own 10-minute timeout, so it can cancel cleanly.
    timeout-minutes: 15
    # One deploy at a time; a newer waiting deploy replaces an older waiting one.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # No source checkout or build runs with Pages permissions.
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
